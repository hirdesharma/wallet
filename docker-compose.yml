# Local Postgres for running the app (tests use Testcontainers instead).
# Start:  docker compose up -d     Stop: docker compose down     Wipe data: docker compose down -v
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wallet
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
    ports:
      - "5432:5432"
    volumes:
      - wallet-pgdata:/var/lib/postgresql/data

  # Web UI to browse the DB: http://localhost:8081
  # System: PostgreSQL | Server: postgres | Username/Password/Database: wallet
  adminer:
    image: adminer:4.8.1
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres

volumes:
  wallet-pgdata:
